# ============================================================
#  Hiyoka Agent - konfigurasi VPS
#  Edit lalu: pm2 restart hiyoka-agent
# ============================================================

# Alamat bot Hiyoka di panel Pterodactyl (IP/domain NODE + port allocation server bot).
# Kosongkan saja, run.sh akan menanyakannya.
HIYOKA_HOST=
HIYOKA_PORT=

# Kunci rahasia, HARUS SAMA dengan vpsLink.secret di config.js bot. Jangan dibagikan.
# Biarkan kosong di repo: bot mengirimnya otomatis saat /connect (atau isi manual / HIYOKA_SECRET=xxx bash run.sh).
HIYOKA_SECRET=

# Proyek kuronime-api di VPS ini
KURO_DIR=/root/kuronime-api
KURO_API=http://127.0.0.1:3000
KURO_PM2=kuronime-api
BACKUP_SCRIPT=backup.sh
BACKUP_TIMEOUT_MIN=10

# File manager: folder paling atas yang boleh diakses bot (jangan isi / kecuali perlu)
UPLOAD_ROOT=/root
MAX_UNZIPPED_MB=200
MAX_ZIP_ENTRIES=5000
